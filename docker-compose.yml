# Green Room — Docker / Synology Container Manager setup (builds from these files).
# Works with older Compose versions (Synology Container Manager).
services:
  greenroom:
    build: .
    image: greenroom-dashboard:latest
    container_name: greenroom-dashboard
    restart: unless-stopped
    # Host networking: Green Room is on port 8080 of the NAS, and can hear
    # Open Sound Meter's multicast levels (UDP 49007).
    # To use a different port, add  PORT: "8090"  under environment.
    network_mode: host
    volumes:
      # Settings, devices and assignments live here (data/db.json). Back this folder up.
      - ./data:/data
    environment:
      TZ: America/New_York
      # Set DEMO: "1" to try it with sample data.
      DEMO: "0"
