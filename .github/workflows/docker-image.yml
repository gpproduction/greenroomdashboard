# Builds the Green Room image on every push and publishes it to GitHub Container Registry.
# The NAS's updater (Watchtower) picks up the new :latest image automatically.
name: Build & publish image

on:
  push:
    branches: [main, claude/brave-feynman-7mpjir]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Never publish a build that fails its tests.
      - name: Test
        run: |
          npm ci
          DATA_DIR=$RUNNER_TEMP/testdata npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Synology DS918+ (Intel)
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/gpproduction/greenroomdashboard:latest
            ghcr.io/gpproduction/greenroomdashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
