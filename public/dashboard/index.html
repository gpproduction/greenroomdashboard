<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backstage</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <link rel="stylesheet" href="/shared/header.css">
  <link rel="stylesheet" href="/shared/footer.css">
  <link rel="stylesheet" href="/shared/themes.css">
  <link rel="stylesheet" href="/shared/holiday.css">
  <link rel="manifest" href="/dashboard/app.webmanifest">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1D4850">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" alt="" src="/branding/logo">
      <div class="heading">
        <div class="title" id="greeting">Welcome</div>
        <div class="plan" id="plan-meta">Loading…</div>
      </div>
    </div>
    <div class="countdown" id="service-countdown"></div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="start-alarm hidden" id="start-alarm" role="alert">
    <span class="alarm-title" id="alarm-title"></span>
    <span class="alarm-time" id="alarm-time"></span>
    <span class="alarm-msg" id="alarm-msg"></span>
  </div>

  <main id="main">
    <section class="roster" id="roster"></section>
    <section class="panel order" id="order-panel">
      <div class="panel-head"><h2>Order of Service</h2><span class="live-status" id="live-status"></span></div>
      <ol id="order"></ol>
    </section>
    <div class="right-col" id="right-col">
    <section class="panel timers" id="timers-panel">
        <h2>Timers</h2>
        <div id="timers"></div>
      </section>
      <section class="panel announcements hidden" id="ann-panel">
        <h2>Announcements</h2>
        <div id="announcements"></div>
      </section>
    </div>
  </main>

  <footer class="status">
    <div class="media" id="media"></div>
    <div class="conns">
      <span id="status-pco"><i class="dot"></i>Planning Center</span>
      <span id="status-pp"><i class="dot"></i>ProPresenter</span>
      <span id="status-unifi" class="hidden"><i class="dot"></i>UniFi Access</span>
      <span id="status-ws"><i class="dot"></i>Live</span>
    </div>
  </footer>

  <script src="/shared/holiday.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
