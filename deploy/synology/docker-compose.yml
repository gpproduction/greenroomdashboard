# Green Room on Synology — runs the published image and keeps it up to date.
# Paste this into Container Manager → Project → Create → "Create docker-compose.yml",
# with the project path set to /docker/greenroom (so ./data is your existing data).
services:
  greenroom:
    image: ghcr.io/gpproduction/greenroomdashboard:latest
    container_name: greenroom-dashboard
    restart: unless-stopped
    # Host networking so Green Room can hear Open Sound Meter's multicast levels
    # (UDP 49007). The web app is on port 8080 of the NAS as before.
    network_mode: host
    volumes:
      - ./data:/data # settings, devices, assignments — keep this folder
    environment:
      TZ: America/New_York
      # Lets the admin "Install updates now" button ask the updater to check right away.
      UPDATER_URL: http://127.0.0.1:8081
      UPDATER_TOKEN: greenroom-update
    labels:
      com.centurylinklabs.watchtower.enable: "true" # only this container is auto-updated

  updater:
    image: containrrr/watchtower:latest
    container_name: greenroom-updater
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080" # updater API, reachable only from the NAS itself
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: America/New_York
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true" # remove old images after updating
      # Check every 15 minutes, Monday–Saturday, 1:00 AM–4:59 PM only:
      # never during Sunday services or evening rehearsals.
      WATCHTOWER_SCHEDULE: "0 */15 1-16 * * 1-6"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: greenroom-update # internal only; port is not published
      # Only if the GitHub package is PRIVATE: a GitHub username + token with read:packages.
      # REPO_USER: your-github-username
      # REPO_PASS: ghp_yourtoken
